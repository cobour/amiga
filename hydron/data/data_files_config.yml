# source, temp and target folders are relative to folder of this config file
sourceFolder: ./
tempFolder: ./_converted
targetFolder: ../uae/dh0
diskimageFolder: ../dist

# asmWorkingFolder is relative to amiga/common/data-tool/app folder
asmWorkingFolder: ../../../hydron

# include filenames are relative to folder of this config file
mainCodeIncludeFilename: ../main_code.i

# filenames of source files are relative to sourceFolder
targetFiles:

  - filename: C000
    description: main_code_file
    memoryType: OTHER
    doZip: false
    codeFile: true
    sources:
      - filename: ../hydron.asm
        id: HYDR
        defines:
          - RELEASE
          - USE_DISK_DMA

  - filename: F000
    description: ingame_chip_common
    memoryType: CHIP
    sources:
      - filename: ingame/common/player_bullets_0.wav      # volume amplified to 20db
        id: SBU0
        volume: 64
        priority: 32
      - filename: ingame/common/ingame_copperlist.asm
        id: IGCL

  - filename: F001
    description: ingame_chip_level_0
    memoryType: CHIP
    sources:      
      - filename: ingame/level_0/vision.mod
        id: MODS # MUST be the same in all levels
      - filename: ingame/level_0/Moon_Enemy32xrotate_01.png
        id: TEST
        flattenedTileFormat: 32x32
        colorsLimit: 64

  - filename: F100
    description: ingame_other_common
    memoryType: OTHER
    sources:
      - filename: ingame/common/panel_score.png
        id: PASC
        withMask: false
        colorsLimit: 2
      - filename: ingame/common/panel_hiscore.png
        id: PAHI
        withMask: false
        colorsLimit: 2
      - filename: ingame/common/panel_lives.png
        id: PALI
        withMask: false
        colorsLimit: 2
      - filename: ingame/common/panel_font.png
        id: PAFO
        withMask: false
        colorsLimit: 2
      - filename: ingame/common/ingame_panel_copper_colors.asm
        id: PACO
      - filename: ingame/common/player_bullets_0.png
        id: PBU0
        withMask: false
        colorsLimit: 16
      - filename: ingame/common/player.png
        id: PLYR
        withMask: false
        colorsLimit: 16

  - filename: F101
    description: ingame_other_level_0
    memoryType: OTHER
    relatedFiles: # all related files must have been already defined! all om-files first, then all cm-files!
      - F100
      - F001
      - F000
    sources:
      - filename: ingame/level_0/vision.mod
        id: MODP # MUST be the same in all levels
      - filename: ingame/level_0/Hydron_Tiles.png
        id: COLS # MUST be the same in all levels
        colorsOnly: true
        colorsLimit: 32
      - filename: ingame/level_0/Hydron_Tiles.png
        id: TLS0 # MUST be the same in all levels
        withMask: false
        flattenedTileFormat: 16x16
        colorsLimit: 64
      - filename: ingame/level_0/MAP_001.tmx
        id: MAPT # MUST be the same in all levels
        reversedVertically: true
      - filename: ingame/level_0/simple_topleft_to_downright.svg
        id: EM01
        numberOfDirections: 32
        numberOfSteps:
          - 100
      - filename: ingame/level_0/simple_multiple_paths.svg
        id: EM02
        numberOfDirections: 32
        numberOfSteps:
          - 100
          - 60
      - filename: ingame/level_0/little_loop.svg
        id: EM03
        numberOfDirections: 32
        numberOfSteps:
          - 300
      - filename: .bobtype
        id: BT00
        gfxId: TEST
        width: 32
        height: 32
      - filename: .enemytype
        id: ET00
        bobtypeId: BT00

diskimageFiles:
  - filename: Hydron.adf
    diskname: HYDR
    mainCodefile: C000
    bootblock:
      - filename: ../src/system/bootblock.asm
        id: BOBL
        isBootblock: true
        defines:
          - BOOTBLOCK
          - RELEASE
          - USE_DISK_DMA
    datafiles:
      - F000
      - F001
      - F100
      - F101
