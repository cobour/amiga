# source, temp and target folders are relative to folder of this config file
sourceFolder: ./
tempFolder: ./_converted
targetFolder: ../uae/dh0
diskimageFolder: ../dist

# asmWorkingFolder is relative to amiga/common/data-tool/app folder
asmWorkingFolder: ../../../hydron

# include filenames are relative to folder of this config file
mainCodeIncludeFilename: ../main_code.i

# filenames of source files are relative to sourceFolder
targetFiles:

  - filename: C000
    description: main_code_file
    memoryType: OTHER
    doZip: false
    codeFile: true
    sources:
      - filename: ../hydron.asm
        id: HYDR
        defines:
          - RELEASE
          - USE_DISK_DMA

  - filename: F000
    description: ingame_chip_common
    memoryType: CHIP
    sources:
      - filename: ingame/common/player_bullets_0.wav      # volume amplified to 20db
        id: SBU0
        volume: 64
        priority: 32
      - filename: ingame/common/ingame_copperlist.asm
        id: IGCL

  - filename: F001
    description: ingame_chip_level_0
    memoryType: CHIP
    sources:      
      - filename: ingame/level_0/vision.mod
        id: MS02
      - filename: ingame/level_0/rotating_enemy_hybris_32x32.iff
        id: TEST

  - filename: F100
    description: ingame_other_common
    memoryType: OTHER
    sources:
      - filename: ingame/common/panel_score.iff
        id: PASC
        withMask: false
      - filename: ingame/common/panel_hiscore.iff
        id: PAHI
        withMask: false
      - filename: ingame/common/panel_lives.iff
        id: PALI
        withMask: false
      - filename: ingame/common/panel_font.iff
        id: PAFO
        withMask: false
      - filename: ingame/common/ingame_panel_copper_colors.asm
        id: PACO
      - filename: ingame/common/player_bullets_0.iff
        id: PBU0
        withMask: false
      - filename: ingame/common/player.iff
        id: PLYR
        withMask: false

  - filename: F101
    description: ingame_other_level_0
    memoryType: OTHER
    relatedFiles: # all related files must have been already defined! all om-files first, then all cm-files!
      - F100
      - F001
      - F000
    sources:
      - filename: ingame/level_0/vision.mod
        id: MP02
      - filename: ingame/level_0/tiles.iff
        id: COLS
        colorsOnly: true
        colorsLimit: 32
      - filename: ingame/level_0/tiles.iff
        id: TLS0
        withMask: false
        flattenedTileFormat: 16x16
      - filename: ingame/level_0/MAP_001.tmx
        id: MAPT
        reversedVertically: true
      - filename: ingame/level_0/simple_topleft_to_downright.svg
        id: EM01
        numberOfSteps: 250
        numberOfDirections: 16
      - filename: .bobtype
        id: BT00
        gfxId: TEST
        width: 32
        height: 32
      - filename: .enemytype
        id: ET00
        bobtypeId: BT00

diskimageFiles:
  - filename: Hydron.adf
    diskname: HYDR
    mainCodefile: C000
    bootblock:
      - filename: ../src/system/bootblock.asm
        id: BOBL
        isBootblock: true
        defines:
          - BOOTBLOCK
          - RELEASE
          - USE_DISK_DMA
    datafiles:
      - F000
      - F001
      - F100
      - F101
