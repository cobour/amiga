# source, temp and target folders are relative to folder of this config file
sourceFolder: ./
tempFolder: ./converted
targetFolder: ../uae/dh0
diskimageFolder: ../dist
# asmWorkingFolder is relative to amiga/common/data-tool/app folder
asmWorkingFolder: ../../../hydron
# include filenames are relative to folder of this config file
mainCodeIncludeFilename: ../main_code.i
# filenames of source files are relative to sourceFolder
targetFiles:

  - filename: C000
    description: main_code_file
    memoryType: OTHER
    doZip: false
    codeFile: true
    sources:
      - filename: ../hydron.asm
        id: HYDR
        defines:
          - BOOTBLOCK
          - RELEASE
          - USE_DISK_DMA

  - filename: F000
    description: ingame_chip_1
    memoryType: CHIP
    sources:
      - filename: gfx/test_ehb_256x256.iff
        id: TSTB
        withMask: false

  - filename: F001
    description: ingame_chip_2
    memoryType: CHIP
    sources:
      - filename: music/revenge_of_earth.mod
        id: MS01
      - filename: sfx/enter.wav
        id: SFX1
        volume: 64
        priority: 64
      - filename: code/ingame_copperlist.asm
        id: IGCL

  - filename: F100
    description: ingame_other_2
    memoryType: OTHER
    sources:
      - filename: gfx/background_tiles.iff
        id: COLS
        colorsOnly: true

  - filename: F101
    description: ingame_other
    memoryType: OTHER
    relatedFiles: # all related files must have been already defined! all om-files first, then all cm-files!
      - F100
      - F001
      - F000
    sources:
#      - filename: tiled/level_1.tmx
#        id: LVLO
#        reversedVertically: true
#      - filename: gfx/background_tiles.iff
#        id: LVLT
#        withMask: false
#        flattenedTileFormat: 16x16
#        flattenedReducedTileCount: 64
      - filename: music/revenge_of_earth.mod
        id: MP01

diskimageFiles:
  - filename: Hydron.adf
    diskname: HYDR
    mainCodefile: C000
    bootblock:
      - filename: ../src/system/bootblock.asm
        id: BOBL
        isBootblock: true
        defines:
          - BOOTBLOCK
          - RELEASE
          - USE_DISK_DMA
    datafiles:
      - F000
      - F001
      - F100
      - F101
