# source, temp and target folders are relative to folder of this config file
sourceFolder: ./
tempFolder: ./converted
targetFolder: ../uae/dh0
# asmWorkingFolder is relative to amiga/common/data-tool/app folder
asmWorkingFolder: ../../../a100
# index filenames are relative to folder of this config file
indexFilename: ../files_index.i
asmIndexFilename: ../asm_files_index.i
# filenames of source files are relative to sourceFolder
targetFiles:

  - filename: C000
    description: main_code_file
    memoryType: OTHER
    doZip: false
    codeFile: true
    sources:
      - filename: ../a100.asm
        id: A100

  - filename: F000
    description: ingame_chip
    memoryType: CHIP
    sources:
      - filename: gfx/ingame_screen.iff
        id: SCRN
        withMask: false
      - filename: gfx/bricks_big.iff
        id: BRBG
      - filename: gfx/bricks_small.iff
        id: BRSM
      - filename: music/revenge_of_earth.mod
        id: MS01
      - filename: sfx/enter.wav
        id: SFX1
        volume: 64
        priority: 64
      - filename: ../src/ingame_copperlist.asm
        id: IGCL

  - filename: F001
    description: ingame_other
    memoryType: OTHER
    relatedFile: F000
    sources:
      - filename: gfx/ingame_screen.iff
        id: COLS
        colorsOnly: true
      - filename: music/revenge_of_earth.mod
        id: MP01
