# source, temp and target folders are relative to folder of this config file
sourceFolder: ./
tempFolder: ./converted
targetFolder: ../uae/dh0
# index filenames are relative to folder of this config file
indexFilename: ../files_index.i
asmIndexFilename: ../asm_files_index.i
# filenames of source files are relative to sourceFolder
targetFiles:
  - filename: C000
    memoryType: OTHER
    doZip: false
    codeFile: true
    sources:
      - filename: ../a100.asm
        id: A100

  - filename: F000
    memoryType: CHIP
    sources:
      - filename: gfx/ingame_screen.iff
        id: TSTB
        withMask: false
      - filename: music/revenge_of_earth.mod
        id: MS01
      - filename: sfx/enter.wav
        id: SFX1
        volume: 64
        priority: 64

  - filename: F001
    memoryType: OTHER
    relatedFile: F000
    sources:
      - filename: gfx/stones_big.iff
        id: STNB
        flattenedTileFormat: 16x16
      - filename: gfx/stones_small.iff
        id: STNS
        flattenedTileFormat: 8x8
      - filename: gfx/ingame_screen.iff
        id: COLS
        colorsOnly: true
      - filename: music/revenge_of_earth.mod
        id: MP01
